<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JobCocoon - Verify Email</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../css/otp-verification.css"></head><body><main class="otp-shell"><section class="otp-card"><div class="otp-mark"><i class="fa-solid fa-envelope-circle-check"></i></div><p class="otp-eyebrow">JOBCOCOON ACCOUNT SECURITY</p><h1>Verify your email</h1><p class="otp-description">Enter the one-time password sent to your email address.</p><form id="otpForm"><label for="otpCode">6-digit verification code</label><input id="otpCode" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required><button type="submit" id="verifyOtpBtn">Verify email</button></form><p id="otpMessage" class="otp-message" role="status" aria-live="polite"></p><button type="button" id="resendOtpBtn" class="otp-resend">Resend code</button><a class="otp-back" href="../index.html">Back to login</a></section></main><script src="../js/api.js"></script><script src="../js/otp-verification.js"></script></body></html>
